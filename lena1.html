<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hey Lena 🙂</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;
--muted:#7d8590;--green:#3fb950;--green-dim:#1a3a1f;--blue:#58a6ff;--red:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
min-height:100vh;display:flex;flex-direction:column;align-items:center;
justify-content:center;padding:2rem 1rem 4rem;color-scheme:dark;}
.container{max-width:420px;width:100%;}
.screen{display:none;}
.screen.active{display:block;}

.repo-path{font-family:'JetBrains Mono',monospace;font-size:.72rem;
color:var(--muted);margin-bottom:1.6rem;letter-spacing:.05em;text-align:center;}
.repo-path span{color:var(--blue);}

.card{background:var(--surface);border:1px solid var(--border);
border-radius:14px;padding:2.2rem 1.8rem;text-align:center;}
.emoji{font-size:3rem;display:block;margin-bottom:1rem;
animation:float 2.8s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.title{font-size:1.2rem;font-weight:700;line-height:1.4;margin-bottom:.5rem;}
.sub{font-size:.85rem;color:var(--muted);line-height:1.6;margin-bottom:1.6rem;}

.opt{width:100%;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:500;
padding:.9rem 1rem;margin-bottom:.6rem;border-radius:10px;border:1px solid var(--border);
background:var(--bg);color:var(--text);cursor:pointer;transition:all .15s;text-align:left;}
.opt:hover{border-color:var(--muted);}
.opt.active{border-color:#238636;background:var(--green-dim);color:var(--green);}
.opt.center{text-align:center;}

.q{font-size:.9rem;font-weight:500;margin:0 0 .6rem;text-align:left;}
.tiny{font-size:.74rem;color:var(--muted);margin:0 0 .55rem;text-align:left;}
input[type=date],input[type=time],input[type=text]{
width:100%;font-family:'Inter',sans-serif;font-size:.95rem;color:var(--text);
background:var(--bg);border:1px solid var(--border);border-radius:9px;
padding:.75rem .9rem;transition:border-color .15s;}
input:focus{outline:none;border-color:var(--blue);}
input::placeholder{color:#565f6b;}
.field{margin-bottom:1.4rem;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.7rem;}
.chip{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;
padding:.5rem .9rem;border-radius:20px;border:1px solid var(--border);
background:var(--bg);color:var(--muted);cursor:pointer;transition:all .15s;}
.chip:hover{border-color:var(--muted);color:var(--text);}
.chip.active{border-color:#238636;background:var(--green-dim);color:var(--green);}

.submit{width:100%;margin-top:1rem;font-family:'Inter',sans-serif;font-size:.98rem;
font-weight:700;background:var(--green-dim);border:1px solid #238636;border-radius:11px;
color:var(--green);padding:1rem;cursor:pointer;transition:all .15s;}
.submit:hover{background:#1f4a26;}
.submit:disabled{opacity:.45;cursor:not-allowed;}

.warn{font-size:.76rem;color:var(--red);margin-top:.7rem;min-height:1rem;}

.summary{font-family:'JetBrains Mono',monospace;background:var(--bg);
border:1px solid var(--border);border-radius:9px;padding:1rem;margin:.4rem 0 1.3rem;
font-size:.85rem;line-height:1.7;text-align:left;}
.summary .k{color:var(--muted);}
.summary .v{color:var(--green);}

.back{background:none;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;
font-size:.72rem;cursor:pointer;margin-top:.6rem;text-decoration:underline;text-underline-offset:3px;}
.back:hover{color:var(--text);}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade{animation:fadeIn .35s ease both;}
@keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
.pop{animation:pop .45s cubic-bezier(.36,.07,.19,.97);}
@media (prefers-reduced-motion:reduce){.emoji,.fade,.pop{animation:none;}}
</style>
</head>
<body>
<div class="container">

  <!-- S1: Aktivität -->
  <div id="s1" class="screen active">
    <div class="repo-path">~ / <span>lena</span> / lena1</div>
    <div class="card">
      <span class="emoji">🙂</span>
      <div class="title">Hey Lena!</div>
      <div class="sub">worauf hättest du lust?<br>einfach antippen 👇</div>

      <button class="opt" data-o="Motorrad fahren 🏍️" onclick="pick(this)">🏍️ &nbsp;Motorrad fahren</button>
      <button class="opt" data-o="Wandern 🥾" onclick="pick(this)">🥾 &nbsp;Wandern</button>
      <button class="opt" data-o="Paddeltennis 🎾" onclick="pick(this)">🎾 &nbsp;Paddeltennis</button>
      <button class="opt" data-o="Essen gehen – Weinstraße 🍷" onclick="pick(this)">🍷 &nbsp;Essen – Weinstraße</button>
      <button class="opt" data-o="Essen gehen – Slowenien 🌄" onclick="pick(this)">🌄 &nbsp;Essen – Slowenien</button>
      <button class="opt" data-o="grad nix 🤷" onclick="pick(this)">🤷 &nbsp;nichts grad</button>

      <button class="submit" id="next" disabled onclick="goNext()">weiter →</button>
      <div class="warn" id="warn1"></div>
    </div>
  </div>

  <!-- S2: (wohin) + Tag & Uhrzeit -->
  <div id="s2" class="screen">
    <div class="repo-path">~ / <span>lena</span> / <span>termin</span></div>
    <div class="card">

      <div class="field" id="whereField" style="display:none;">
        <p class="q">wohin? 🥾</p>
        <input type="text" id="where" maxlength="80" placeholder="z.B. Schöckl, Plabutsch, …"/>
      </div>

      <div class="field">
        <p class="q">welcher tag passt dir?</p>
        <p class="tiny">geht erst ab 25.9. bei mir 🙂</p>
        <input type="date" id="date" oninput="validate2()"/>
      </div>

      <div class="field">
        <p class="q">und wann ungefähr?</p>
        <div class="chips" id="times">
          <button type="button" class="chip" data-t="10:00" onclick="pickT(this)">10:00 · vormittag</button>
          <button type="button" class="chip" data-t="14:00" onclick="pickT(this)">14:00 · nachmittag</button>
          <button type="button" class="chip" data-t="18:00" onclick="pickT(this)">18:00 · abend</button>
          <button type="button" class="chip" data-t="19:00" onclick="pickT(this)">19:00</button>
        </div>
        <input type="time" id="time" oninput="onTimeInput()"/>
      </div>

      <button class="submit" id="send" disabled onclick="send()">abschicken 🙂</button>
      <div class="warn" id="warn2"></div>
      <div style="text-align:center;"><button class="back" onclick="show('s1')">← zurück</button></div>
    </div>
  </div>

  <!-- S3: fertig -->
  <div id="s3" class="screen">
    <div class="card">
      <span class="emoji pop">🙂</span>
      <div class="title">perfekt!</div>
      <div class="summary" id="summary"></div>
      <div class="sub" style="margin-bottom:.8rem;">ich hab's bekommen 🙂</div>
      <button class="back" onclick="show('s1')">← doch was anderes</button>
    </div>
  </div>

  <!-- S4: nichts? sicher? -->
  <div id="s4" class="screen">
    <div class="card">
      <span class="emoji">🥺</span>
      <div class="title">sicher?</div>
      <div class="sub">wär doch schad — wir hätten sicher<br>einen richtig lustigen tag 🙂</div>
      <button class="opt center" id="nixSend" onclick="confirmNix()">ja, grad wirklich nix 🙈</button>
      <button class="opt center" onclick="show('s1')">na gut, doch was 🙂</button>
      <div class="warn" id="warn4"></div>
    </div>
  </div>

</div>

<script>
// derselbe Formspree-Endpoint wie besprochen:
const ENDPOINT = "https://formspree.io/f/xaqgpvrg";

let choice = "";

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active','fade'));
  const el=document.getElementById(id); el.classList.add('active','fade');
  window.scrollTo(0,0);
}

function pick(btn){
  document.querySelectorAll('.opt').forEach(o=>{ if(o.dataset.o) o.classList.remove('active'); });
  btn.classList.add('active');
  choice = btn.dataset.o;
  document.getElementById('next').disabled = false;
  document.getElementById('warn1').textContent = '';
}

function goNext(){
  if(!choice){ document.getElementById('warn1').textContent='bitte was auswählen 🙂'; return; }
  if(choice.indexOf('nix') !== -1){ show('s4'); return; }
  // "wohin?" nur bei Wandern zeigen
  document.getElementById('whereField').style.display =
    (choice.indexOf('Wandern') !== -1) ? 'block' : 'none';
  show('s2');
}

function confirmNix(){ send(); }

function pickT(btn){
  document.querySelectorAll('#times .chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('time').value = btn.dataset.t;
  validate2();
}
function onTimeInput(){
  const t = document.getElementById('time').value;
  document.querySelectorAll('#times .chip').forEach(c=>c.classList.toggle('active', c.dataset.t===t));
  validate2();
}
function validate2(){
  const ok = !!document.getElementById('date').value && !!document.getElementById('time').value;
  document.getElementById('send').disabled = !ok;
  if(ok) document.getElementById('warn2').textContent='';
  return ok;
}

function fmtDate(str){
  const d = new Date(str + 'T00:00');
  return d.toLocaleDateString('de-AT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

async function send(){
  const isNix = choice.indexOf('nix') !== -1;
  let dateLabel = "", t = "", where = "";
  if(!isNix){
    if(!validate2()){ document.getElementById('warn2').textContent='bitte tag und uhrzeit auswählen 🙂'; return; }
    dateLabel = fmtDate(document.getElementById('date').value);
    t = document.getElementById('time').value;
    if(choice.indexOf('Wandern') !== -1) where = document.getElementById('where').value.trim();
  }

  const btn = isNix ? document.getElementById('nixSend') : document.getElementById('send');
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'wird gesendet…';

  try{
    const form = new FormData();
    form.append('Lust auf', choice);
    if(where) form.append('Wohin', where);
    if(!isNix){ form.append('Tag', dateLabel); form.append('Uhrzeit', t + ' Uhr'); }
    form.append('_subject', 'Lena: ' + choice);

    const res = await fetch(ENDPOINT, { method:'POST', headers:{'Accept':'application/json'}, body:form });
    if(res.ok){
      document.getElementById('summary').innerHTML =
        `<span class="k">lust auf:</span> <span class="v">${escapeHtml(choice)}</span>` +
        (where ? `<br><span class="k">wohin:</span> <span class="v">${escapeHtml(where)}</span>` : '') +
        (!isNix ? `<br><span class="k">tag:</span>  <span class="v">${dateLabel}</span>` +
                  `<br><span class="k">zeit:</span> <span class="v">${t} Uhr</span>` : '');
      show('s3');
    } else { throw new Error('Server '+res.status); }
  } catch(e){
    document.getElementById(isNix ? 'warn4' : 'warn2').textContent='hat nicht geklappt — nochmal probieren?';
  } finally {
    btn.disabled=false; btn.textContent=old;
  }
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Datum erst ab 25.09. wählbar
document.getElementById('date').min = "2026-09-25";
</script>
</body>
</html>
